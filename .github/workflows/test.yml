name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  main:
    name: Main (node --test + coverage ≥90%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test + coverage
        run: npm run test:coverage

  renderer:
    name: Renderer (vitest + coverage ≥90% + lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mangacount.client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix mangacount.client

      - name: Lint
        run: npm run lint:renderer

      - name: Test + coverage
        run: npm run test:renderer:coverage
